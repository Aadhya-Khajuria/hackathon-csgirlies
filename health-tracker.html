    <div class="tracker-box">
      <h2 class="title">Daily Health Tracker</h2>
      <form id="trackerForm">
        <div class="form-group">
          <label>Enter Your Name:</label>
          <input type="text" id="name" required />
        </div>
        <div class="form-group">
          <label>Glasses of water today?</label>
          <input type="number" id="water" step="any" required />
        </div>
        <div class="form-group">
          <label>Hours of sleep today?</label>
          <input type="number" id="sleep" step="any" required />
        </div>
        <div class="form-group">
          <label>Steps walked today:</label>
          <input type="number" id="steps" required />
        </div>
        <button type="submit">Submit</button>
      </form>

      <div id="results" class="results">
        <div id="summaryUser" class="user"></div>
        <div id="waterResult"></div>
        <div id="sleepResult"></div>
        <div id="stepsResult"></div>
      </div>
    </div>

    <script>
      document
        .getElementById("trackerForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const name = document.getElementById("name").value;
          const water = parseFloat(document.getElementById("water").value);
          const sleep = parseFloat(document.getElementById("sleep").value);
          const steps = parseInt(document.getElementById("steps").value);

          document.getElementById(
            "summaryUser"
          ).innerText = `📊Health summary for ${name}:`;

          const waterDiv = document.getElementById("waterResult");
          if (water >= 8) {
            waterDiv.className = "good-news";
            waterDiv.innerText = ":💧 Water: Great hydration today!";
          } else {
            waterDiv.className = "alert-news";
            waterDiv.innerText =
              "💧 Water: Drink more water! Aim for 8 glasses.";
          }

          const sleepDiv = document.getElementById("sleepResult");
          if (sleep >= 8) {
            sleepDiv.className = "good-news";
            sleepDiv.innerText = "🌙 Sleep: Excellent sleep schedule!";
          } else {
            sleepDiv.className = "alert-news";
            sleepDiv.innerText = "🌙 Sleep: Try to sleep at least 8 hours.";
          }

          const stepsDiv = document.getElementById("stepsResult");
          if (steps >= 5000) {
            stepsDiv.className = "good-news";
            stepsDiv.innerText = `🔥 Steps: Amazing activity levels today, ${name}!`;
          } else {
            stepsDiv.className = "alert-news";
            stepsDiv.innerText = `👟 Steps: Try to get moving more, ${name}! Aim for over 5,000 steps.`;
          }

          document.getElementById("results").style.display = "block";
        });
    </script>
