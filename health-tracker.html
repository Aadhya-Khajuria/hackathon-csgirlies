<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Health Tracker</title>
    <style>
      :root {
        /* these hex codes were coppied from a canva slideshow used to help wire-frame our code */
        --deepLavendar: #5a4d7a;
        --lilac: #b8a4d4;
        --softMauve: #d5c8e4;
        --midLavendar: #e0d6eb;
        --blush: #eae3f0;
      }
      body {
        background-color: var(--blush);
        margin: 0px;
        padding: 0;
      }
      /* navbar css start */
      .navBar {
        width: 100%;
        height: 70px;
        position: fixed;
        top: 0;
        left: 0;
        display: inline;
        z-index: 3;
      }
      nav {
        display: flex;
        flex-direction: row;
        float: sticky;
        background-color: var(--lilac);
        border-bottom: 6px solid var(--deepLavendar);
        right: 35px;
        padding-top: 25px;
        gap: 25px;
        justify-content: flex-end;
      }
      .name {
        margin-right: auto;
        margin-left: 30px;
      }
      .name h2 {
        margin: 0;
        font-family: "Poppins", sans-serif;
        color: white;
        font-weight: bold;
      }
      .navBar a {
        text-decoration: none;
        color: white;
        padding: 0 10px;
        font-weight: bold;
        margin-bottom: 10px;
        font-family: "Poppins", sans-serif;
      }

      nav a:hover {
        color: #5a4d7a;
      }

      .dropdown-content {
        display: none;
        position: absolute;
        background-color: #b8a4d4;
        height: 60px;
        width: 120px;
        z-index: 1;
      }

      .dropdown:hover .dropdown-content {
        display: flex;
        flex-direction: column;
        align-content: center;
      }
      #dropdown1 {
        height: 60px;
        width: 140px;
        padding-top: 10px;
      }
      #dropdown2 {
        height: 90px;
        width: 140px;
        padding-top: 10px;
      }

      #dropdown3 {
        height: 60px;
        padding-top: 10px;
      }
      .tracker-box {
        background: #ffffff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        max-width: 420px;
        margin: 80px auto;
      }
      /* navbar css end */
      .title {
        color: #8123a9;
        border-bottom: 3px solid #c36fe2;
        padding-bottom: 8px;
        margin-top: 0;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #9555b0;
      }
      input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd6fe;
        border-radius: 6px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        background-color: #8b4fab;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background-color: #4a176b;
      }
      .results {
        display: none;
        margin-top: 20px;
      }
      .user {
        font-weight: 700;
        color: #4a176b;
        margin: 15px 0 10px 0;
        font-size: 16px;
      }
      .good-news {
        background-color: #f0fdf4;
        color: #8b34c5;
        padding: 12px;
        border-left: 5px solid #aa75ce;
        border-radius: 4px;
        margin: 8px 0;
        font-weight: 600;
      }
      .alert-news {
        background-color: #fff5f5;
        color: #8b34c5;
        padding: 12px;
        border-left: 5px solid #aa75ce;
        border-radius: 4px;
        margin: 8px 0;
        font-weight: 600;
      }
      h3 {
        background-color: var(--deepLavendar);
        border: 3px solid var(--deepLavendar);
        border-radius: 20px;
        max-width: 150px;
      }
      h3 {
        display: flex;
        justify-content: center;
      }
      h2 {
        display: flex;
        justify-content: center;
      }
      h1 {
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="navBar">
      <nav>
        <div class="name">
          <a href="index.html">Mental health</a>
        </div>
        <div class="dropdown">
          <a>Education</a>
          <div class="dropdown-content" id="dropdown1">
            <a href="education-mental.html">Mental Health</a>
            <a href="education-physical.html">Physical Health</a>
          </div>
        </div>
        <div class="dropdown">
          <a>Trackers</a>
          <div class="dropdown-content" id="dropdown2">
            <a href="mood-tracker.html">Mood</a>
            <a href="mindfullness-tracker.html">Mindfullness</a>
            <a href="health-tracker.html">Health</a>
          </div>
        </div>
        <a href="planner.html">Planner</a>
        <div class="dropdown">
          <a>Self Care</a>
          <div class="dropdown-content" id="dropdown3">
            <a href="self-care-mental.html">Mental</a>
            <a href="self-care-physical.html">Physical</a>
          </div>
        </div>
        <a href="kindness-wall.html">Kindness Wall</a>
      </nav>
    </div>

    <div class="tracker-box">
      <h2 class="title">Daily Health Tracker</h2>
      <form id="trackerForm">
        <div class="form-group">
          <label>Enter Your Name:</label>
          <input type="text" id="name" required />
        </div>
        <div class="form-group">
          <label>Glasses of water today?</label>
          <input type="number" id="water" step="any" required />
        </div>
        <div class="form-group">
          <label>Hours of sleep today?</label>
          <input type="number" id="sleep" step="any" required />
        </div>
        <div class="form-group">
          <label>Steps walked today:</label>
          <input type="number" id="steps" required />
        </div>
        <button type="submit">Submit</button>
      </form>

      <div id="results" class="results">
        <div id="summaryUser" class="user"></div>
        <div id="waterResult"></div>
        <div id="sleepResult"></div>
        <div id="stepsResult"></div>
      </div>
    </div>

    <script>
      document
        .getElementById("trackerForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const name = document.getElementById("name").value;
          const water = parseFloat(document.getElementById("water").value);
          const sleep = parseFloat(document.getElementById("sleep").value);
          const steps = parseInt(document.getElementById("steps").value);

          document.getElementById(
            "summaryUser"
          ).innerText = `📊Health summary for ${name}:`;

          const waterDiv = document.getElementById("waterResult");
          if (water >= 8) {
            waterDiv.className = "good-news";
            waterDiv.innerText = ":💧 Water: Great hydration today!";
          } else {
            waterDiv.className = "alert-news";
            waterDiv.innerText =
              "💧 Water: Drink more water! Aim for 8 glasses.";
          }

          const sleepDiv = document.getElementById("sleepResult");
          if (sleep >= 8) {
            sleepDiv.className = "good-news";
            sleepDiv.innerText = "🌙 Sleep: Excellent sleep schedule!";
          } else {
            sleepDiv.className = "alert-news";
            sleepDiv.innerText = "🌙 Sleep: Try to sleep at least 8 hours.";
          }

          const stepsDiv = document.getElementById("stepsResult");
          if (steps >= 5000) {
            stepsDiv.className = "good-news";
            stepsDiv.innerText = `🔥 Steps: Amazing activity levels today, ${name}!`;
          } else {
            stepsDiv.className = "alert-news";
            stepsDiv.innerText = `👟 Steps: Try to get moving more, ${name}! Aim for over 5,000 steps.`;
          }

          document.getElementById("results").style.display = "block";
        });
    </script>
  </body>
</html>
