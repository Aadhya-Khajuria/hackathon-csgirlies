<!DOCTYPE html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Health Tracker</title>
    <style>
:root {
  --deepLavendar: #5a4d7a;
  --lilac: #b8a4d4;
  --softMauve: #d5c8e4;
  --midLavendar: #e0d6eb;
  --blush: #eae3f0;
}

body {
  background-color: var(--blush);
  margin: 0;
  padding: 0;
  padding-top: 70px;
}

.navBar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 70px;
  z-index: 100;
}

nav {
  height: 70px;
  display: flex;
  align-items: center;
  background-color: var(--lilac);
  border-bottom: 6px solid var(--deepLavendar);
  padding: 0 25px;
  gap: 25px;
}

.name {
  margin-right: auto;
  margin-left: 10px;
  display: flex;
  align-items: center;
}

.name a {
  color: white;
  text-decoration: none;
  font-family: "Poppins", sans-serif;
  font-weight: bold;
  font-size: 22px;
}

#favicon {
  width: 35px;
  height: 35px;
  object-fit: cover;
  border: none;
  border-radius: 50%;
  margin: 0 8px 0 0;
}

.navBar > nav > a,
.dropdown > a {
  text-decoration: none;
  color: white;
  padding: 10px;
  font-weight: bold;
  font-family: "Poppins", sans-serif;
  cursor: pointer;
}

nav a:hover {
  color: var(--deepLavendar);
}

.dropdown {
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
}

.dropdown-content {
  display: none;
  position: absolute;
  top: 70px;
  left: 0;
  background-color: var(--lilac);
  min-width: 140px;
  z-index: 101;
  padding: 10px 0;
  border-radius: 0 0 10px 10px;
  box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
}

.dropdown-content a {
  display: block;
  padding: 10px 15px;
  color: white;
  text-decoration: none;
  white-space: nowrap;
}

.dropdown-content a:hover {
  background-color: var(--softMauve);
  color: var(--deepLavendar);
}

.dropdown:hover .dropdown-content {
  display: flex;
  flex-direction: column;
}

#dropdown1,
#dropdown2,
#dropdown3 {
  min-width: 140px;
  height: auto;
}

.tracker-box {
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  max-width: 420px;
  margin: 80px auto;
}

.title {
  color: var(--deepLavendar);
  border-bottom: 3px solid var(--lilac);
  padding-bottom: 8px;
  margin-top: 0;
}

.form-group {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 5px;
  font-weight: 600;
  color: var(--deepLavendar);
}

input {
  width: 100%;
  padding: 8px;
  border: 1px solid var(--midLavendar);
  border-radius: 6px;
  box-sizing: border-box;
}

button {
  width: 100%;
  background-color: var(--deepLavendar);
  color: white;
  border: none;
  padding: 10px;
  border-radius: 30px;
  font-weight: 600;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background-color: var(--lilac);
}

.results {
  display: none;
  margin-top: 20px;
}

.user {
  font-weight: 700;
  color: var(--deepLavendar);
  margin: 15px 0 10px;
  font-size: 16px;
}

.good-news {
  background-color: #f0fdf4;
  color: var(--deepLavendar);
  padding: 12px;
  border-left: 5px solid var(--lilac);
  border-radius: 4px;
  margin: 8px 0;
  font-weight: 600;
}

.alert-news {
  background-color: #fff5f5;
  color: var(--deepLavendar);
  padding: 12px;
  border-left: 5px solid var(--lilac);
  border-radius: 4px;
  margin: 8px 0;
  font-weight: 600;
}

h1,
h2 {
  display: flex;
  justify-content: center;
}

h3 {
  background-color: var(--deepLavendar);
  color: white;
  border: 3px solid var(--deepLavendar);
  border-radius: 20px;
  max-width: 150px;
  display: flex;
  justify-content: center;
}

.site-footer {
  background-color: var(--deepLavendar);
  color: white;
  text-align: center;
  padding: 40px 20px 25px;
  margin-top: 60px;
}

.site-footer h2 {
  color: white;
  margin-bottom: 10px;
}

.site-footer p {
  background: none;
  border: none;
  color: white;
  margin: 8px 0;
}

.team-link {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 28px;
  background-color: #6b4c9a;
  color: white;
  text-decoration: none;
  border-radius: 999px;
  font-weight: 600;
  transition: 0.2s ease;
}

.team-link:hover {
  background-color: #563b80;
  transform: translateY(-2px);
}
    </style>
  </head>
  <body>
    <div class="navBar">
      <nav>
        <div class="name">
           <img id="favicon" src="love.png" alt="girl with hearts"/>
          <a href="index.html">Wellify</a>
        </div>
        <div class="dropdown">
          <a>Education</a>
          <div class="dropdown-content" id="dropdown1">
            <a href="education-mental.html">Mental Health</a>
            <a href="education-physical.html">Physical Health</a>
          </div>
        </div>
        <div class="dropdown">
          <a>Trackers</a>
          <div class="dropdown-content" id="dropdown2">
            <a href="mood-tracker.html">Mood</a>
            <a href="mindfullness-tracker.html">Mindfullness</a>
            <a href="health-tracker.html">Health</a>
          </div>
        </div>
        <a href="planner.html">Planner</a>
        <div class="dropdown">
          <a>Self Care</a>
          <div class="dropdown-content" id="dropdown3">
            <a href="self-care-mental.html">Mental</a>
            <a href="self-care-physical.html">Physical</a>
          </div>
        </div>
        <a href="kindness-wall.html">Kindness Wall</a>
      </nav>
    </div>

    <div class="tracker-box">
      <h2 class="title">Daily Health Tracker</h2>
      <form id="trackerForm">
        <div class="form-group">
          <label>Enter Your Name:</label>
          <input type="text" id="name" required />
        </div>
        <div class="form-group">
          <label>Glasses of water today?</label>
          <input type="number" id="water" step="any" required />
        </div>
        <div class="form-group">
          <label>Hours of sleep today?</label>
          <input type="number" id="sleep" step="any" required />
        </div>
        <div class="form-group">
          <label>Steps walked today:</label>
          <input type="number" id="steps" required />
        </div>
        <button type="submit">Submit</button>
      </form>

      <div id="results" class="results">
        <div id="summaryUser" class="user"></div>
        <div id="waterResult"></div>
        <div id="sleepResult"></div>
        <div id="stepsResult"></div>
      </div>
    </div>

    <script>
      document
        .getElementById("trackerForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const name = document.getElementById("name").value;
          const water = parseFloat(document.getElementById("water").value);
          const sleep = parseFloat(document.getElementById("sleep").value);
          const steps = parseInt(document.getElementById("steps").value);

          document.getElementById(
            "summaryUser"
          ).innerText = `📊Health summary for ${name}:`;

          const waterDiv = document.getElementById("waterResult");
          if (water >= 8) {
            waterDiv.className = "good-news";
            waterDiv.innerText = ":💧 Water: Great hydration today!";
          } else {
            waterDiv.className = "alert-news";
            waterDiv.innerText =
              "💧 Water: Drink more water! Aim for 8 glasses.";
          }

          const sleepDiv = document.getElementById("sleepResult");
          if (sleep >= 8) {
            sleepDiv.className = "good-news";
            sleepDiv.innerText = "🌙 Sleep: Excellent sleep schedule!";
          } else {
            sleepDiv.className = "alert-news";
            sleepDiv.innerText = "🌙 Sleep: Try to sleep at least 8 hours.";
          }

          const stepsDiv = document.getElementById("stepsResult");
          if (steps >= 5000) {
            stepsDiv.className = "good-news";
            stepsDiv.innerText = `🔥 Steps: Amazing activity levels today, ${name}!`;
          } else {
            stepsDiv.className = "alert-news";
            stepsDiv.innerText = `👟 Steps: Try to get moving more, ${name}! Aim for over 5,000 steps.`;
          }

          document.getElementById("results").style.display = "block";
        });
    </script>
    <footer class="site-footer">
  <div class="footer-content">
    <h2>Wellify 💜</h2>
    <p>Take care of your mind, body, and wellbeing.</p>

    <a href="meet-the-team.html" class="team-link">Meet the Team →</a>

    <p class="footer-small">Made with 💜 by the Wellify team</p>
  </div>
</footer>
  </body>
</html>
